<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AI Recruitment Platform{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background:#f5f1e8;
            min-height:100vh;
        }

        /* Utility Bar (notifications) */

        .utility-bar{
            display:flex;
            justify-content:flex-end;
            gap:10px;
            padding:14px 20px;
        }

        .icon-btn{
            background:#ffffff;
            color:#1a1a1a;
            border:1px solid #ece5da;
            border-radius:14px;
            padding:8px 16px;
            font-weight:600;
            text-decoration:none;
            font-size:0.9rem;
            position:relative;
        }

        .icon-btn:hover{
            background:#d96b3b;
            color:white;
        }

        /* Authentication Pages */

        .auth-container{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .auth-card{
            background:#ffffff;
            width:100%;
            max-width:520px;
            border-radius:24px;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .brand-logo{
            width:60px;
            height:60px;
            background:#d96b3b;
            color:#fff;
            border-radius:16px;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0 auto 20px;
            font-size:26px;
            font-weight:700;
        }

        h2{
            font-weight:700;
        }

        .text-muted{
            color:#6c757d !important;
        }

        /* Inputs */

        .form-control,
        .form-select{

            border-radius:14px;
            padding:12px 15px;
            border:1px solid #ddd;
            font-family:'Poppins',sans-serif;

        }

        .form-control:focus,
        .form-select:focus{

            border-color:#d96b3b;
            box-shadow:0 0 0 .2rem rgba(217,107,59,.15);

        }

        .form-label{

            font-weight:600;
            margin-bottom:8px;

        }

        /* Password Toggle */

        .input-group .btn{

            border-radius:0 14px 14px 0;
            border:1px solid #ddd;

        }

        .input-group .btn:hover{

            background:#d96b3b;
            color:white;

        }

        /* Main Button */

        .btn-primary-custom{

            width:100%;
            background:#111111;
            color:white;
            border:none;
            border-radius:14px;
            padding:12px;
            font-weight:600;
            transition:.3s;

        }

        .btn-primary-custom:hover{

            background:#d96b3b;
            color:white;
            transform:translateY(-2px);

        }

        /* Links */

        .custom-link{

            color:#d96b3b;
            text-decoration:none;
            font-weight:600;

        }

        .custom-link:hover{

            text-decoration:underline;

        }

        /* Alerts */

        .alert{

            border-radius:12px;

        }

        /* Small Text */

        small{

            font-size:13px;

        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

{% if session.get('email') %}
<div class="utility-bar">
    <a href="{{ url_for('view_notifications') }}" class="icon-btn">
        🔔 Notifications
        {% if unread_notifications_count and unread_notifications_count > 0 %}
            <span class="badge bg-danger">{{ unread_notifications_count }}</span>
        {% endif %}
    </a>
</div>
{% endif %}

{% block content %}
{% endblock %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Password Toggle -->

<script>

function togglePassword(inputId, iconId){

    const password=document.getElementById(inputId);
    const icon=document.getElementById(iconId);

    if(password.type==="password"){

        password.type="text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");

    }

    else{

        password.type="password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");

    }

}

</script>

{% block extra_js %}
{% endblock %}

</body>
</html>
